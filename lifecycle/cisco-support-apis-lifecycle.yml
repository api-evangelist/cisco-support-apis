description: >-
  Versioning, deprecation, support and status posture for the Cisco Support APIs.
  The honest summary: the APIs are versioned in the path, there is no published
  deprecation policy, no Sunset/Deprecation header, no SLA, and the changelog page
  is empty. Cisco does operate a public status page and staffed support channels.
