  notes: >-
    No API deprecation or version-retirement policy is published anywhere in the
    Support APIs documentation. Cisco's End-of-Life Policy
    (https://www.cisco.com/c/en/us/products/eos-eol-policy.html) governs PRODUCTS,
    not these APIs — which is a notable irony for an API portfolio whose flagship
    service reports other products' end-of-life milestones. There is no announced
    retirement date for any older version and no Sunset or Deprecation response
    header was observed.
