  spellings_in_use: ['5', 'v1', 'v1.0', 'v2', 'v2.0', 'v3', 'v4.0']
  current:
    Automated Software Distribution: v4.0
    Bug: v2.0
    Case: v3
    EoX: '5'
    Product Information: v1
    Serial Number to Information: v2
    Service Order Return (RMA): v1.0
    Software Suggestion: v2
  docs: https://developer.cisco.com/docs/support-apis/api-changelog/
  notes: >-
    Four different version spellings across eight APIs. The published WADL filenames
    disagree with two of the live paths (ASD WADL is v2_0 against a live /v4.0/;
    Software Suggestion WADL is v1_0 against a live /v2/), so the downloadable
    contracts are behind the running services.
