description: >-
  Cisco ships NO first-party client library for the Support APIs in any language.
  The Support APIs documentation has no SDK section and links no client code; the
  only first-party developer artifact Cisco publishes on GitHub for these APIs is a
  Postman collection (CiscoDevNet/Cisco_Support_API_Postman, BSD-3-Clause, last
  pushed 2020-08-07). The two Python libraries below are community projects by
  individual authors and are recorded as unofficial. npm, Maven Central, NuGet,
  pkg.go.dev, RubyGems, Packagist and crates.io returned no Cisco Support APIs
  client at all.
