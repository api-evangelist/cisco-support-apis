method: searched
format: proprietary
source: The "Error Codes" section of each of the eight Cisco Support API reference pages on developer.cisco.com
  (see per-API docs URLs below).
description: 'Error catalogue for the eight Cisco Support APIs, transcribed from Cisco''s own published
  error tables. The Support APIs do NOT use RFC 9457 application/problem+json. Two distinct error layers
  are in play: the Mashery gateway layer (HTTP status + X-Mashery-Error-Code response header, observed
  live) and an application layer whose codes are returned inside the JSON body, frequently with an HTTP
  status that does not match the semantics.'
envelope:
  media_type: application/json (EoX also supports application/xml via ?responseencoding=xml)
  gateway_layer:
    signal: HTTP status + X-Mashery-Error-Code response header
    observed:
    - url: https://apix.cisco.com/sn2info/v2/coverage/status/serial_numbers/FOC10220LK9
      status: 403
      x_mashery_error_code: ERR_403_NOT_AUTHORIZED
    - url: https://api.cisco.com/sn2info/v2/coverage/status/serial_numbers/FOC10220LK9
      status: 403
      x_mashery_error_code: ERR_403_DEVELOPER_INACTIVE
  application_layer:
    signal: 'A code/message pair inside the JSON response body (field name varies by API: ErrorResponse,
      ErrorDetailsType, EOXError, error_response).'
    note: There is no single shared error schema across the eight APIs.
agent_semantics_warnings:
- issue: Client errors returned as HTTP 403
  detail: The Bug API documents API_MISSING_PARAMETERS, API_INVALID_INPUT and EXCEEDED_INPUTS at HTTP
    403, and the Case API returns every validation error (INVALID_DATEFORMAT, INVALID_SORT_OPTION, MISSING_INPUTS,
    ...) at 403. An agent cannot distinguish "your credentials are wrong, stop retrying" from "your date
    format is wrong, fix and retry" by status code alone; it must parse the body code.
- issue: Errors returned as HTTP 200
  detail: Bug, Serial Number to Information and Automated Software Distribution document NO_RECORDS_FOUND,
    API_INVALID_INPUT, EXCEEDED_OUTPUT and a family of contract/entitlement tokens (CONTRACT_NOT_AUTH,
    IMG_K9, CONTRACT_LOGIN, ...) at HTTP 200. A 200 is not a success signal on these APIs.
- issue: Rate limiting returned as HTTP 403, not 429
  detail: Every API documents ERR_403_DEVELOPER_OVER_QPS and ERR_403_DEVELOPER_OVER_RATE / "Account Over
    Rate Limit" at HTTP 403. No 429 and no Retry-After are documented, so standard client backoff on 429
    will never fire.
- issue: Non-standard HTTP status 596
  detail: The gateway returns 596 "Service Not Found" — a Mashery-specific code outside the IANA registry
    — and the docs note it usually means whitespace in the input parameters.
- issue: Inconsistent codes for the same condition across APIs
  detail: The same authorization failure is API_NOTAUTHORIZED (Bug, SN2INFO), CASE_API_FORBIDDEN (Case),
    SSA_ERR_034/SSA_ERR_036 (EoX) and ERR_403_NOT_AUTHORIZED (Software Suggestion, gateway).
