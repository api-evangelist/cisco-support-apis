generated: '2026-08-19'
method: probed
source: https://developer.cisco.com/docs/support-apis/cisco-support-apis-wadl-files/
description: >-
  Cisco DOES publish a machine-readable contract for every one of the eight Support
  APIs — a WADL file per API, linked from a "Downloads" page in the public
  documentation — plus a Swagger YAML for Automated Software Distribution v4.0
  referenced in that API's reference page. None of them is anonymously fetchable:
  every link resolves to apiconsole.cisco.com (Cisco's Mashery portal), which
  answers HTTP 403 with "You do not have permission to view this page. Please Sign
  In or Register" to an unauthenticated client. The contract exists and is
  published; the wall is on the download, not on the documentation. This artifact
  records that distinction so the profile is not read as "Cisco has no spec".
  API Evangelist has NOT authored a substitute contract.
finding: contract-published-but-credential-gated
contract_format: WADL 1.0 (Web Application Description Language) + one Swagger YAML
anonymous_fetch: false
gate:
  host: apiconsole.cisco.com
  kind: portal-sign-in
  observed_status: 403
  observed_body: >-
    "Cisco API Console — Sign In — You do not have permission to view this page.
    Please Sign In or Register."
  server_header: Mashery Proxy
  who_can_pass: >-
    A Cisco.com account that has been granted Support API access by a Smart Net
    Total Care (SNTC) Delegated Administrator, or a Cisco Partner Support Service
    (PSS) partner account onboarded through the Smart Service Bureau.
documents:
  - api: Automated Software Distribution
    version: v2.0 (per the download filename)
    url: https://apiconsole.cisco.com/files/Cisco-Automated-Software-Distribution-API-v2_0.wadl
    status: 403
  - api: Bug
    version: v2.0
    url: https://apiconsole.cisco.com/files/Cisco-BUG-API-v2_0.wadl
    status: 403
  - api: Case
