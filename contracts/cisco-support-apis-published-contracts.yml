    status: 403
  - api: EoX
    version: v5.0
    url: https://apiconsole.cisco.com/files/Cisco-End-of-Life-EOX-v5_0.wadl
    status: 403
  - api: Product Information
    version: v1.0
    url: https://apiconsole.cisco.com/files/Cisco-ProductInfo-API-v1_0.wadl
    status: 403
  - api: Serial Number to Information
