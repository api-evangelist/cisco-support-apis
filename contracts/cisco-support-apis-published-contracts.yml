additional_claims:
  - api: Automated Software Distribution
    claim: >-
      "The Swagger YAML for the Cisco Automated Software Distribution API v4.0 is
      available for download from the Cisco API Console."
    source: https://developer.cisco.com/docs/support-apis/automated-software-distribution/
    anonymous_url: null
    note: >-
      No anonymous URL is given for the Swagger YAML; it is only reachable from
      inside the signed-in API Console. This is the only OpenAPI/Swagger artifact
      Cisco names anywhere in the Support APIs documentation.
staleness_signals:
  - signal: WADL filename versions disagree with the live paths
    detail: >-
      The published ASD WADL is named v2_0 while the documented and live base path
      is /software/v4.0/. The Software Suggestion WADL is named v1_0 while the
      documented and live base path is /software/suggestion/v2/.
  - signal: The public API Changelog page has zero entries
    detail: >-
      https://developer.cisco.com/docs/support-apis/api-changelog/ lists all eight
      APIs with a single heading each reading "(changelog begins)" and no dated
      entries, so a consumer cannot tell what changed or when.
what_would_fix_it:
  - Publish the WADL (or better, an OpenAPI 3.x conversion) at an anonymous URL on developer.cisco.com.
  - Gate the credentials, not the contract — an integrator cannot evaluate what they cannot read.
  - Publish the ASD v4.0 Swagger YAML at a stable public URL and link it from the API reference.
