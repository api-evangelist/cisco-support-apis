description: >-
  Cisco does NOT ship an MCP server for the Support APIs. This is a candidate tool
  list only — it is what an MCP server over these APIs would expose, derived from
  operations Cisco actually documents, so it is useful for planning and NOT a claim
  that any agent surface exists. No `MCPServer` pointer is wired into apis.yml for
  this file, because there is nothing for an agent to call.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: oauth
  verified: probed
searched:
  - what: Support-APIs-specific MCP endpoint
    probes:
      - {url: 'https://apix.cisco.com/mcp', method: 'POST tools/list', status: 504}
      - {url: 'https://developer.cisco.com/mcp', method: 'POST tools/list', status: 404}
    result: none
  - what: Cisco DevNet foundation-search MCP
    probes:
      - {url: 'https://devnet.cisco.com/v1/foundation-search-mcp/mcp', method: 'POST tools/list', status: 200}
    result: >-
      Live and answers tools/list anonymously, but it is NOT a Support APIs surface.
      Its three tools are Meraki-API-Doc-Search, Meraki-API-OperationId-Search and
      CatalystCenter-API-Doc-Search — Meraki and Catalyst Center documentation
      search. It belongs to the Cisco DevNet platform (see the `cisco` provider
      profile), not to this product, and is deliberately not claimed here.
  - what: npm / MCP registries
    result: no @cisco or Cisco Support APIs MCP package found
candidate_tools:
  - name: get_eox_by_product_id
    description: Return end-of-life milestones for up to 20 Cisco product IDs.
    source_operation: 'GET /supporttools/eox/rest/5/EOXByProductID/{pageIndex}/{productID}'
  - name: get_eox_by_serial_number
    description: Return end-of-life milestones for up to 20 serial numbers.
    source_operation: 'GET /supporttools/eox/rest/5/EOXBySerialNumber/{pageIndex}/{serialNumber}'
  - name: get_eox_by_dates
    description: Return products whose end-of-life milestones fall in a date range.
    source_operation: 'GET /supporttools/eox/rest/5/EOXByDates/{pageIndex}/{startDate}/{endDate}'
  - name: get_eox_by_software_release
    description: Return end-of-life milestones for up to 20 software release strings.
    source_operation: 'GET /supporttools/eox/rest/5/EOXBySWReleaseString/{pageIndex}'
