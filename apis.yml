aid: cisco-support-apis
name: Cisco Support APIs
description: 'The Cisco Support APIs are the machine-readable side of Cisco''s TAC and lifecycle operations: EoX
  for end-of-life milestones, Serial Number to Information for entitlement and coverage, Product Information, Software
  Suggestion, Bug, Case, Automated Software Distribution, and Service Order Return. They are the APIs that let an
  enterprise reconcile its Cisco estate against support status programmatically, and are documented on Cisco DevNet
  behind a Smart Net Total Care or partner entitlement.'
url: https://raw.githubusercontent.com/api-evangelist/cisco-support-apis/refs/heads/main/apis.yml
type: Index
access: 3rd-Party
position: Consumer
x-type: company
x-source: cisco-family-buildout:2026-08-19
x-parent: cisco
x-relationship: product
x-contract-status: gated
x-contract-note: Cisco DOES publish a machine-readable contract for all eight Support APIs — a WADL per API, linked
  from the public docs, plus a Swagger YAML for Automated Software Distribution v4.0 — but every download resolves
  to apiconsole.cisco.com and returns HTTP 403 without a Cisco API Console sign-in (probed 2026-08-19). No OpenAPI
  is anonymously fetchable. The only first-party machine-readable artifact a member of the public can download is
  the CiscoDevNet Postman collection (BSD-3, last updated 2020-08-07), saved verbatim under postman/. API Evangelist
  has NOT authored a substitute contract. See contracts/cisco-support-apis-published-contracts.yml.
