description: >-
  Cisco does not publish a sandbox, test mode, test tenant or set of test values for
  the Support APIs. There is no test-vs-live key distinction — a client credential is
  either entitled against real customer support data or it does not work at all.
  The Cisco API Console does carry an "Interactive APIs" tab, which is the only
  try-it surface, and it is behind the same sign-in as the contracts: the console
  returns HTTP 403 to an anonymous client. No `Sandbox` pointer is wired into
  apis.yml, because nothing here is reachable without an entitled account.
